[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiingo"
version = "0.1.0"
description = "Mutual funds' daily net asset values from Tiingo into an Open Meridian deployment's lake"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# The SDK and nothing else, pinned exactly: the sidecar this runs beside
# speaks one version of the contract (v18), and a range would let a rebuild
# pick up another. The Dockerfile's base is the same version. Tiingo's API
# is called with the standard library: no third-party dependency.
dependencies = [
  "open-meridian==0.22.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "mypy>=1.11",
  "ruff>=0.6",
]

[project.scripts]
tiingo = "tiingo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# The pages' templates and the synthetic responses, installed beside the
# code that reads them.
[tool.setuptools.package-data]
tiingo = ["templates/*.html", "synthetic/*.json"]

# What this plugin says about itself, which `meridian plugin upload` sends and
# a deployment admin approves before it runs (W8). Declarations, not grants.
[tool.meridian]
# Roles from the deployment's fixed list -- ccm, compliance, custody, dgm, ems,
# match, oms, operations, portfolio, reporting, servicing, settlement, signal
# -- and its grants are theirs. `dgm`: it records prices into the lake and
# answers the lake's wants, W10's steps.
roles = ["dgm"]
# Whether it serves a page through its sidecar.
interface = true
# Its declaration (contract v18): its catalogue, its storage and its settings,
# its token among them, secret.
# Upload reads it from the built image with `meridian-declaration`.
declaration = "tiingo.declaration:DECLARATION"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["tiingo"]
known-local-folder = ["conftest"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# The SDK's gRPC stubs have no types (meridian-python's own configuration
# says the same).
[[tool.mypy.overrides]]
module = [
    "meridian.v1.sidecar_pb2_grpc",
    "meridian.v1.envelope_pb2_grpc",
    "meridian.plugin.v1.operations_pb2_grpc",
]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
